<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listopadové víkendy 2026</title><style>body{margin:0;background:#f4f6fb;color:#17243a;font:16px system-ui}main{max-width:650px;margin:35px auto;padding:18px}.panel{background:white;border-radius:20px;padding:25px;box-shadow:0 5px 24px #17243a12;margin-bottom:18px}h1{font-size:29px;margin:0 0 8px}h2{font-size:20px}p{color:#607086}input[type=text],textarea{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd5e3;border-radius:10px;font:inherit}textarea{min-height:85px}label.option{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid #dce3ef;border-radius:11px;margin:9px 0;cursor:pointer}input[type=checkbox]{width:20px;height:20px;accent-color:#386bd9}button{border:0;border-radius:10px;padding:12px 16px;cursor:pointer;font:inherit;background:#e8efff;color:#2453a7}button.primary{background:#3568d7;color:white;width:100%;margin-top:15px;font-weight:700}button:disabled{opacity:.5}.actions{display:flex;gap:8px;margin:15px 0}.bar{background:#e8edf7;border-radius:9px;overflow:hidden;height:12px}.fill{height:100%;background:#4a79dc}.result{margin:16px 0}.meta{display:flex;justify-content:space-between;margin-bottom:6px}.person{border-top:1px solid #e8edf3;padding:12px 0}.small{font-size:13px;color:#66768d}#status{margin-top:10px;color:#365f9c}</style></head><body><main><section class="panel"><h1>🍂 Listopadové víkendy</h1><p>Vyber všechny víkendy, kdy se můžeš zúčastnit. Výsledky vidí všichni.</p><form id="vote"><label for="name">Tvoje jméno</label><input id="name" type="text" maxlength="60" required placeholder="Např. Petr"><h2>Kdy se ti to hodí?</h2><div id="options"></div><div class="actions"><button type="button" id="all">Všechny</button><button type="button" id="none">Žádný</button></div><label for="comment">Komentář (nepovinný)</label><textarea id="comment" maxlength="500" placeholder="Např. v neděli až odpoledne"></textarea><button class="primary" id="save">Uložit hlasování</button><div id="status" role="status"></div></form></section><section class="panel"><h2>Průběžné výsledky</h2><p id="count">Načítám…</p><div id="results"></div><h2>Odpovědi</h2><div id="people"></div><button id="refresh">Obnovit výsledky</button><p class="small">Výsledky se automaticky aktualizují každých 20 sekund. Pro úpravu hlasu použij stejné zařízení a prohlížeč.</p></section></main><script>const weekends=['7.–8. listopadu','14.–15. listopadu','21.–22. listopadu','28.–29. listopadu'];const $=id=>document.getElementById(id);let id=localStorage.getItem('voterId');if(!id){id=crypto.randomUUID();localStorage.setItem('voterId',id)}$('options').innerHTML=weekends.map((w,i)=>`<label class="option"><input type="checkbox" value="${i}">${w} 2026</label>`).join('');const checks=()=>[...document.querySelectorAll('input[type=checkbox]')];$('all').onclick=()=>checks().forEach(c=>c.checked=true);$('none').onclick=()=>checks().forEach(c=>c.checked=false);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{let r=await fetch('/.netlify/functions/votes',{cache:'no-store'});if(!r.ok)throw Error('Načtení selhalo');let data=await r.json(),votes=data.votes||[];$('count').textContent=`Hlasovalo ${votes.length} lidí`;$('results').innerHTML=weekends.map((w,i)=>{let yes=votes.filter(v=>v.dates.includes(i));let pct=votes.length?100*yes.length/votes.length:0;return `<div class="result"><div class="meta"><strong>${w}</strong><span>${yes.length} / ${votes.length}</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="small">${yes.map(v=>esc(v.name)).join(', ')||'Zatím nikdo'}</div></div>`}).join('');$('people').innerHTML=votes.map(v=>`<div class="person"><strong>${esc(v.name)}</strong><div class="small">${v.dates.length?v.dates.map(i=>weekends[i]).join(', '):'Žádný termín'}</div>${v.comment?`<div>${esc(v.comment)}</div>`:''}</div>`).join('')||'<p>Zatím nikdo nehlasoval.</p>';let own=votes.find(v=>v.id===id);if(own&&!document.activeElement.matches('input,textarea')){$('name').value=own.name;$('comment').value=own.comment;checks().forEach(c=>c.checked=own.dates.includes(Number(c.value)))}}catch(e){$('count').textContent='Výsledky se nepodařilo načíst.'}}$('refresh').onclick=load;setInterval(load,20000);$('vote').onsubmit=async e=>{e.preventDefault();let btn=$('save');btn.disabled=true;$('status').textContent='Ukládám…';try{let r=await fetch('/.netlify/functions/votes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name:$('name').value.trim(),comment:$('comment').value.trim(),dates:checks().filter(c=>c.checked).map(c=>Number(c.value))})});if(!r.ok)throw Error((await r.json()).error||'Chyba ukládání');$('status').textContent='Hlasování uloženo.';await load()}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};load();</script></body></html>
